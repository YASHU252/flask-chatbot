<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --accent: #7c6af7; --accent2: #a78bfa; --accent-glow: rgba(124,106,247,0.15);
      --user-bg: #1e1b3a; --user-border: rgba(124,106,247,0.3); --bot-bg: #141418;
      --text: #e8e8f0; --text-muted: #6b6b7e; --text-dim: #9898a8;
      --green: #34d399; --red: #f87171;
      --sidebar: 260px;
      --font: 'Sora', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: width 0.2s ease;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; }
    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .new-chat-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); border: none; border-radius: 8px;
      color: white; font-size: 12px; font-family: var(--font); font-weight: 500;
      padding: 6px 12px; cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .new-chat-btn:hover { background: var(--accent2); }
    #session-list { flex: 1; overflow-y: auto; padding: 8px 8px; }
    #session-list::-webkit-scrollbar { width: 3px; }
    #session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
    .session-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s; margin-bottom: 2px; group: true;
    }
    .session-item:hover { background: var(--surface2); }
    .session-item.active { background: var(--user-bg); border: 1px solid var(--user-border); }
    .session-icon { font-size: 13px; flex-shrink: 0; color: var(--text-muted); }
    .session-name { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; line-height: 1.4; }
    .session-item.active .session-name { color: var(--text); }
    .del-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 14px; padding: 2px 4px; border-radius: 4px;
      opacity: 0; transition: opacity 0.1s, color 0.1s; flex-shrink: 0; line-height: 1;
    }
    .session-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: var(--red); }
    .no-sessions { padding: 24px 12px; text-align: center; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    body::before {
      content: ''; position: fixed; top: -30%; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(124,106,247,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .toggle-btn {
      background: transparent; border: 1px solid var(--border2);
      color: var(--text-muted); border-radius: 7px; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 14px; transition: all 0.15s; flex-shrink: 0;
    }
    .toggle-btn:hover { background: var(--surface2); color: var(--text); }
    .logo-mark {
      width: 32px; height: 32px; background: var(--accent); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px rgba(124,106,247,0.35); flex-shrink: 0;
    }
    .logo-mark svg { width: 16px; height: 16px; fill: white; }
    .header-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .status-pill {
      display: flex; align-items: center; gap: 5px; padding: 4px 10px;
      background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2);
      border-radius: 99px; font-size: 11px; color: var(--green); font-weight: 500;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

    /* ── Chat window ── */
    #chat-window {
      flex: 1; overflow-y: auto; padding: 28px 20px;
      display: flex; flex-direction: column; gap: 6px;
      position: relative; z-index: 1; scroll-behavior: smooth;
    }
    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 48px 24px;
      text-align: center; animation: fade-up 0.4s ease;
    }
    .empty-icon {
      width: 60px; height: 60px; background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 0 32px var(--accent-glow);
    }
    .empty-title { font-size: 19px; font-weight: 600; }
    .empty-sub { font-size: 13px; color: var(--text-muted); max-width: 260px; line-height: 1.6; }
    .suggestion-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 6px; max-width: 460px; }
    .chip {
      padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 99px; font-size: 12px; color: var(--text-dim); cursor: pointer;
      transition: all 0.15s; font-family: var(--font);
    }
    .chip:hover { background: var(--user-bg); border-color: var(--user-border); color: var(--accent2); }

    /* ── Messages ── */
    .msg-group {
      display: flex; flex-direction: column; gap: 4px;
      animation: fade-up 0.22s ease; max-width: 760px; width: 100%; margin: 0 auto;
    }
    @keyframes fade-up { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
    .msg-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); padding: 0 4px;
    }
    .msg-label.user-label { text-align: right; color: var(--accent2); opacity: 0.7; }
    .bubble {
      padding: 13px 17px; border-radius: 13px; font-size: 14px;
      line-height: 1.7; font-weight: 400; max-width: 100%; word-break: break-word;
    }
    .bubble.user {
      background: var(--user-bg); border: 1px solid var(--user-border);
      border-radius: 13px 13px 4px 13px; color: #d4d0ff;
      align-self: flex-end; max-width: 75%;
    }
    .bubble.bot {
      background: var(--bot-bg); border: 1px solid var(--border);
      border-radius: 4px 13px 13px 13px; color: var(--text);
      align-self: flex-start; max-width: 85%;
    }
    .bubble.error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--red); font-size: 13px; }
    .bubble pre { background: #0d0d14; border: 1px solid var(--border); border-radius: 7px; padding: 11px 13px; overflow-x: auto; margin: 9px 0; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: #b8c0e0; }
    .bubble code:not(pre code) { font-family: var(--mono); font-size: 12px; background: rgba(124,106,247,0.12); color: var(--accent2); padding: 1px 5px; border-radius: 4px; }

    /* ── Typing indicator ── */
    .typing-bubble {
      background: var(--bot-bg); border: 1px solid var(--border);
      border-radius: 4px 13px 13px 13px; padding: 13px 17px;
      align-self: flex-start; animation: fade-up 0.2s ease;
      display: flex; align-items: center; gap: 5px;
    }
    .typing-bubble span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

    /* ── Input area ── */
    .input-area {
      position: relative; z-index: 10;
      padding: 14px 20px 18px; border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.9); backdrop-filter: blur(12px); flex-shrink: 0;
    }
    .input-wrapper {
      display: flex; align-items: flex-end; gap: 9px;
      background: var(--surface); border: 1px solid var(--border2); border-radius: 13px;
      padding: 9px 9px 9px 15px; transition: border-color 0.15s, box-shadow 0.15s;
      max-width: 760px; margin: 0 auto;
    }
    .input-wrapper:focus-within { border-color: rgba(124,106,247,0.4); box-shadow: 0 0 0 3px rgba(124,106,247,0.08); }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: var(--font);
      resize: none; max-height: 130px; min-height: 24px; line-height: 1.6; padding: 2px 0;
    }
    #user-input::placeholder { color: var(--text-muted); }
    #send-btn {
      width: 34px; height: 34px; background: var(--accent); border: none; border-radius: 9px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s; box-shadow: 0 0 14px rgba(124,106,247,0.3);
    }
    #send-btn:hover { background: var(--accent2); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.96); }
    #send-btn:disabled { background: var(--surface2); box-shadow: none; cursor: not-allowed; opacity: 0.5; }
    #send-btn svg { width: 15px; height: 15px; fill: white; }
    .input-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 9px; max-width: 760px; margin-left: auto; margin-right: auto; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(8px);
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
      padding: 8px 16px; font-size: 12px; color: var(--text-dim);
      opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 100; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">History</span>
      <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
    </div>
    <div id="session-list">
      <div class="no-sessions">No chats yet.<br>Start a conversation!</div>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <header>
      <div class="header-left">
        <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle history">☰</button>
        <div class="logo-mark">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
        </div>
        <div>
          <div class="header-title">AI Assistant</div>
          <div class="header-sub">Powered by OpenAI GPT</div>
        </div>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        Online
      </div>
    </header>

    <div id="chat-window">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-title">How can I help you?</div>
        <div class="empty-sub">Your conversations are saved automatically.</div>
        <div class="suggestion-chips">
          <div class="chip" onclick="sendSuggestion('Explain OOPs in Python with examples')">OOPs in Python</div>
          <div class="chip" onclick="sendSuggestion('What is a REST API and how does Flask handle it?')">REST APIs in Flask</div>
          <div class="chip" onclick="sendSuggestion('How does SQLite work with Python?')">SQLite + Python</div>
          <div class="chip" onclick="sendSuggestion('What Git commands should I know for interviews?')">Git for interviews</div>
          <div class="chip" onclick="sendSuggestion('What Python projects should I build as a fresher?')">Project ideas</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Ask anything..." rows="1" autocomplete="off" spellcheck="true"></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── State ──────────────────────────────────────────
    let currentSessionId = null;
    const chatWindow   = document.getElementById('chat-window');
    const userInput    = document.getElementById('user-input');
    const sendBtn      = document.getElementById('send-btn');

    // ── Init ───────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      loadSessions();
      userInput.focus();
    });

    // ── Sidebar ────────────────────────────────────────
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    async function loadSessions() {
      try {
        const res  = await fetch('/sessions');
        const data = await res.json();
        renderSessionList(data.sessions || []);
      } catch(e) { console.error('Could not load sessions', e); }
    }

    function renderSessionList(sessions) {
      const list = document.getElementById('session-list');
      if (!sessions.length) {
        list.innerHTML = '<div class="no-sessions">No chats yet.<br>Start a conversation!</div>';
        return;
      }
      list.innerHTML = sessions.map(s => `
        <div class="session-item ${s.id === currentSessionId ? 'active' : ''}"
             id="si_${s.id}" onclick="loadSession('${s.id}')">
          <span class="session-icon">💬</span>
          <span class="session-name">${escHtml(s.title || 'Untitled')}</span>
          <button class="del-btn" onclick="deleteSession(event,'${s.id}')" title="Delete">✕</button>
        </div>`).join('');
    }

    function markActiveSession(id) {
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      const el = document.getElementById('si_' + id);
      if (el) el.classList.add('active');
    }

    // ── Session actions ────────────────────────────────
    function newChat() {
      currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      clearChatWindow();
      markActiveSession(null);
      userInput.focus();
    }

    async function loadSession(sessionId) {
      currentSessionId = sessionId;
      markActiveSession(sessionId);
      clearChatWindow();
      try {
        const res  = await fetch('/history/' + sessionId);
        const data = await res.json();
        (data.messages || []).forEach(m => addMessage(m.role, m.content));
        scrollToBottom();
      } catch(e) { showToast('Could not load session'); }
    }

    async function deleteSession(e, sessionId) {
      e.stopPropagation();
      try {
        await fetch('/session/' + sessionId, { method: 'DELETE' });
        if (sessionId === currentSessionId) newChat();
        loadSessions();
        showToast('Chat deleted');
      } catch(e) { showToast('Delete failed'); }
    }

    // ── Messaging ──────────────────────────────────────
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || sendBtn.disabled) return;

      addMessage('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: currentSessionId })
        });
        const data = await res.json();
        removeTypingIndicator();

        if (data.error) {
          addMessage('bot', '⚠ ' + data.error, true);
        } else {
          addMessage('bot', data.reply);
          // Refresh sidebar to show new/updated session
          loadSessions();
          markActiveSession(currentSessionId);
        }
      } catch(err) {
        removeTypingIndicator();
        addMessage('bot', '⚠ Could not reach the server. Is Flask running?', true);
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    function sendSuggestion(text) {
      userInput.value = text;
      sendMessage();
    }

    // ── DOM helpers ────────────────────────────────────
    function clearChatWindow() {
      chatWindow.querySelectorAll('.msg-group, .empty-state').forEach(el => el.remove());
      const es = document.createElement('div');
      es.className = 'empty-state'; es.id = 'empty-state';
      es.innerHTML = `
        <div class="empty-icon">✦</div>
        <div class="empty-title">How can I help you?</div>
        <div class="empty-sub">Your conversations are saved automatically.</div>
        <div class="suggestion-chips">
          <div class="chip" onclick="sendSuggestion('Explain OOPs in Python with examples')">OOPs in Python</div>
          <div class="chip" onclick="sendSuggestion('What is a REST API?')">REST APIs</div>
          <div class="chip" onclick="sendSuggestion('How does SQLite work with Python?')">SQLite + Python</div>
        </div>`;
      chatWindow.appendChild(es);
    }

    function addMessage(role, content, isError = false) {
      const es = document.getElementById('empty-state');
      if (es) es.remove();

      const group  = document.createElement('div');  group.className = 'msg-group';
      const label  = document.createElement('div');
      label.className = 'msg-label ' + (role === 'user' ? 'user-label' : '');
      label.textContent = role === 'user' ? 'You' : 'Assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (isError ? 'error' : role);
      bubble.innerHTML = formatContent(content);

      group.appendChild(label);
      group.appendChild(bubble);
      chatWindow.appendChild(group);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const es = document.getElementById('empty-state');
      if (es) es.remove();
      const group = document.createElement('div'); group.className = 'msg-group'; group.id = 'typing-indicator';
      const label = document.createElement('div'); label.className = 'msg-label'; label.textContent = 'Assistant';
      const t = document.createElement('div'); t.className = 'typing-bubble';
      t.innerHTML = '<span></span><span></span><span></span>';
      group.appendChild(label); group.appendChild(t);
      chatWindow.appendChild(group); scrollToBottom();
    }

    function removeTypingIndicator() {
      const t = document.getElementById('typing-indicator');
      if (t) t.remove();
    }

    function scrollToBottom() { chatWindow.scrollTop = chatWindow.scrollHeight; }

    function formatContent(text) {
      return text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/\n/g,'<br>');
    }

    function escHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── Input events ───────────────────────────────────
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 130) + 'px';
    });
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
